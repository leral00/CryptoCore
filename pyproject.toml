[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "1.0.0"
description = "CLI tool for AES-128 encryption (ECB, CBC, CFB, OFB, CTR) and SHA-256 / SHA3-256 file hashing."
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "CryptoCore Team" }
]

requires-python = ">=3.9"

dependencies = [
    "pycryptodome>=3.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
cryptocore = "cryptocore.cli_parser:main"

[tool.setuptools.packages.find]
where = ["src"]
